<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate secure random passwords with our advanced password generator tool">
    <meta name="author" content="Your Company Name">
    <title>Secure Password Generator | Create Strong Random Passwords</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="password-generator-card">
            <header class="card-header">
                <h1 class="title">Secure Password Generator</h1>
                <p class="subtitle">Create strong, randomized passwords for enhanced security</p>
            </header>
            
            <div class="card-body">
                <div class="password-output-group">
                    <input type="text" 
                           id="password" 
                           class="password-display"
                           placeholder="Your secure password will appear here"
                           readonly
                           aria-label="Generated password">
                    <button type="button" 
                            class="copy-button" 
                            id="copy"
                            aria-label="Copy password to clipboard">
                        <i class="fas fa-clipboard"></i>
                    </button>
                </div>
                
                <div class="security-rating">
                    <span class="rating-text">Password Strength:</span>
                    <div class="strength-indicator">
                        <div class="indicator-bar"></div>
                        <span class="strength-text">Very Strong</span>
                    </div>
                </div>
            </div>

            <footer class="card-footer">
                <button type="button" 
                        class="generate-button" 
                        id="btn"
                        aria-label="Generate new password">
                    Generate Secure Password
                </button>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
